[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaussian-splat-shot-render"
version = "0.1.1"
description = "ComfyUI custom node pack for scouting and rendering calibrated camera shots over Gaussian splat scenes."
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22",
    "plyfile>=0.7.4",
    "huggingface-hub>=0.23.0",
    "numba>=0.58.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/EnviralDesign/gaussian-splat-shot-render-comfyui"
Documentation = "https://github.com/EnviralDesign/gaussian-splat-shot-render-comfyui#readme"
"Bug Tracker" = "https://github.com/EnviralDesign/gaussian-splat-shot-render-comfyui/issues"

[tool.comfy]
PublisherId = "enviral-design"
DisplayName = "Gaussian Splat Shot Render"
